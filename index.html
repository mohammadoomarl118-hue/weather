<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الطقس الآن</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      color: white;

      background: linear-gradient(135deg, #38bdf8, #2563eb);

      transition: background 1s ease;
    }

    /* حالات الطقس */

    body.sunny {
      background:
        radial-gradient(circle at 80% 10%, #fde68a, transparent 25%),
        linear-gradient(135deg, #38bdf8, #2563eb);
    }

    body.cloudy {
      background:
        linear-gradient(135deg, #94a3b8, #64748b, #334155);
    }

    body.rainy {
      background:
        linear-gradient(135deg, #64748b, #475569, #1e293b);
    }

    body.storm {
      background:
        linear-gradient(135deg, #312e81, #1e1b4b, #111827);
    }

    body.snow {
      background:
        linear-gradient(135deg, #dbeafe, #93c5fd, #475569);
    }

    body.fog {
      background:
        linear-gradient(135deg, #cbd5e1, #94a3b8, #475569);
    }

    .app {
      width: 100%;
      max-width: 470px;
    }

    .weather-card {
      padding: 28px;
      border-radius: 32px;

      background: rgba(255, 255, 255, 0.13);

      border: 1px solid rgba(255, 255, 255, 0.25);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.25);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
    }

    /* البحث */

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;

      height: 55px;

      padding: 0 18px;

      border: none;
      outline: none;

      border-radius: 17px;

      background: white;
      color: #111827;

      font-size: 16px;
    }

    .search-box button {
      width: 58px;
      height: 55px;

      border: none;
      border-radius: 17px;

      background: #2563eb;
      color: white;

      font-size: 21px;

      cursor: pointer;

      transition: 0.25s;
    }

    .search-box button:hover {
      transform: translateY(-3px);
      background: #1d4ed8;
    }

    .search-box button:active {
      transform: scale(0.95);
    }

    /* الموقع */

    .location {
      text-align: center;
      margin-top: 10px;
    }

    .location h2 {
      font-size: 32px;
    }

    .location p {
      margin-top: 6px;

      color: rgba(255, 255, 255, 0.7);

      font-size: 14px;
    }

    /* الطقس */

    .weather-main {
      text-align: center;
      padding: 15px 0 25px;
    }

    .weather-icon {
      font-size: 90px;
      margin: 15px 0;

      animation: floating 3s ease-in-out infinite;

      filter:
        drop-shadow(0 10px 15px rgba(0, 0, 0, 0.2));
    }

    @keyframes floating {
      0% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }

      100% {
        transform: translateY(0);
      }
    }

    .temperature {
      font-size: 76px;
      font-weight: 700;
      line-height: 1;
    }

    .temperature span {
      font-size: 27px;
      vertical-align: top;
    }

    .description {
      margin-top: 15px;

      font-size: 19px;

      color: rgba(255, 255, 255, 0.9);
    }

    /* المعلومات */

    .info-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 12px;
    }

    .info-card {
      min-height: 105px;

      padding: 17px;

      border-radius: 20px;

      background:
        rgba(255, 255, 255, 0.1);

      border:
        1px solid rgba(255, 255, 255, 0.13);

      transition: 0.25s;
    }

    .info-card:hover {
      transform: translateY(-3px);

      background:
        rgba(255, 255, 255, 0.17);
    }

    .info-icon {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .info-title {
      font-size: 12px;

      color:
        rgba(255, 255, 255, 0.65);

      margin-bottom: 5px;
    }

    .info-value {
      font-size: 17px;
      font-weight: 600;
    }

    /* الرسائل */

    .message {
      text-align: center;

      padding: 35px 15px;

      line-height: 1.8;

      color:
        rgba(255, 255, 255, 0.8);
    }

    .big-icon {
      display: block;

      font-size: 65px;

      margin-bottom: 10px;
    }

    /* التحميل */

    .loading {
      text-align: center;
      padding: 35px;
    }

    .spinner {
      width: 42px;
      height: 42px;

      margin: 0 auto 15px;

      border-radius: 50%;

      border:
        4px solid rgba(255, 255, 255, 0.2);

      border-top-color: white;

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* الخطأ */

    .error {
      padding: 20px;

      text-align: center;

      border-radius: 18px;

      background:
        rgba(239, 68, 68, 0.18);

      color: #ffe4e4;

      line-height: 1.8;
    }

    /* الهاتف */

    @media (max-width: 500px) {
      .weather-card {
        padding: 22px 17px;
        border-radius: 27px;
      }

      .header h1 {
        font-size: 29px;
      }

      .temperature {
        font-size: 65px;
      }

      .weather-icon {
        font-size: 78px;
      }
    }

    @media (max-width: 360px) {
      .info-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    /* ========================================
       توحيد البحث العربي
    ======================================== */

function normalizeArabic(text) {
  return text
    .normalize("NFKD")
    .toLowerCase()
    .trim()

    // إزالة التشكيل
    .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, "")

    // جميع أشكال الألف
    .replace(/[أإآٱٲٳٵ]/g, "ا")

    // أشكال الهمزة
    .replace(/[ؤئ]/g, "ء")

    // الألف المقصورة
    .replace(/ى/g, "ي")

    // التاء المربوطة
    .replace(/ة/g, "ه")

    // توحيد المسافات
    .replace(/\s+/g, " ");

}


    /* ========================================
       العثور على مدينة معروفة
    ======================================== */

    function findKnownCity(cityName) {

      const normalized =
        normalizeArabic(cityName);

      for (const key in knownCities) {

        if (
          normalizeArabic(key) === normalized
        ) {

          return knownCities[key];

        }

      }

      return null;
    }

          مكة
          مكة، السعودية

        */

        let cityName =
          parts[0];


        /*
          تحويل الاسم الإنجليزي
          إلى الاسم المعروف
        */

        const lowerName =
          cityName.toLowerCase();


        if (
          aliases[lowerName]
        ) {

          cityName =
            aliases[lowerName];

        }


        /*
          البحث في القائمة المحلية
        */

        const known =
          findKnownCity(cityName);


        if (known) {

          await displayWeather(

            known.lat,

            known.lon,

            known.name,

            known.country

          );

          return;
        }


        /*
          إذا لم تكن المدينة
          في القائمة، استخدم API
        */

        await searchWithAPI(cityName);

      } catch (error) {

        console.error(error);

        showError();

      }

    }


    /* ========================================
       البحث العالمي
    ======================================== */

    async function searchWithAPI(city) {

      const url =
        "https://geocoding-api.open-meteo.com/v1/search" +
        "?name=" +
        encodeURIComponent(city) +
        "&count=10" +
        "&language=ar" +
        "&format=json";


      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          "Geocoding failed"
        );

      }


      const data =
        await response.json();


      if (
        !data.results ||
        data.results.length === 0
      ) {

        result.innerHTML = `
          <div class="error">

            ❌ لم يتم العثور على المدينة

            <br><br>

            جرّب كتابة اسمها
            بطريقة مختلفة.

          </div>
        `;

        return;
      }


      /*
        اختيار نتيجة مناسبة
      */

      let location =
        data.results.find(
          item =>
            item.feature_code &&
            item.feature_code.startsWith("P")
        );


      if (!location) {

        location =
          data.results[0];

      }


      await displayWeather(

        location.latitude,

        location.longitude,

        location.name,

        location.country || "غير معروف"

      );

    }


    /* ========================================
       عرض الطقس
    ======================================== */

    async function displayWeather(
      latitude,
      longitude,
      city,
      country
    ) {

      const url =
        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" +
        latitude +

        "&longitude=" +
        longitude +

        "&current=" +
        "temperature_2m," +
        "relative_humidity_2m," +
        "apparent_temperature," +
        "weather_code," +
        "wind_speed_10m" +

        "&timezone=auto";


      const response =
        await fetch(url);


      if (!response.ok) {

        throw new Error(
          "Weather API failed"
        );

      }


      const data =
        await response.json();


      const current =
        data.current;


      const temperature =
        Math.round(
          current.temperature_2m
        );


      const feelsLike =
        Math.round(
          current.apparent_temperature
        );


      const humidity =
        current.relative_humidity_2m;


      const wind =
        Math.round(
          current.wind_speed_10m
        );


      const weather =
        getWeatherInfo(
          current.weather_code
        );


      changeTheme(
        weather.theme
      );


      result.innerHTML = `

        <div class="location">

          <h2>
            ${escapeHTML(city)}
          </h2>

          <p>
            📍 ${escapeHTML(country)}
          </p>

        </div>


        <div class="weather-main">

          <div class="weather-icon">
            ${weather.icon}
          </div>

          <div class="temperature">

            ${temperature}

            <span>
              °C
            </span>

          </div>

          <div class="description">
            ${weather.text}
          </div>

        </div>


        <div class="info-grid">


          <div class="info-card">

            <div class="info-icon">
              🌡️
            </div>

            <div class="info-title">
              الحرارة المحسوسة
            </div>

            <div class="info-value">
              ${feelsLike}°C
            </div>

          </div>


          <div class="info-card">

            <div class="info-icon">
              💧
            </div>

            <div class="info-title">
              الرطوبة
            </div>

            <div class="info-value">
              ${humidity}%
            </div>

          </div>


          <div class="info-card">

            <div class="info-icon">
              💨
            </div>

            <div class="info-title">
              سرعة الرياح
            </div>

            <div class="info-value">
              ${wind} km/h
            </div>

          </div>


          <div class="info-card">

            <div class="info-icon">
              📍
            </div>

            <div class="info-title">
              الإحداثيات
            </div>

            <div class="info-value">
              ${latitude.toFixed(2)},
              ${longitude.toFixed(2)}
            </div>

          </div>


        </div>

      `;

    }


    /* ========================================
       وصف حالة الطقس
    ======================================== */

    function getWeatherInfo(code) {

      if (code === 0) {

        return {
          icon: "☀️",
          text: "سماء صافية",
          theme: "sunny"
        };

      }


      if (
        code === 1 ||
        code === 2
      ) {

        return {
          icon: "🌤️",
          text: "غائم جزئيًا",
          theme: "cloudy"
        };

      }


      if (code === 3) {

        return {
          icon: "☁️",
          text: "غائم",
          theme: "cloudy"
        };

      }


      if (
        code === 45 ||
        code === 48
      ) {

        return {
          icon: "🌫️",
          text: "ضباب",
          theme: "fog"
        };

      }


      if (
        code >= 51 &&
        code <= 67
      ) {

        return {
          icon: "🌧️",
          text: "أجواء ممطرة",
          theme: "rainy"
        };

      }


      if (
        code >= 71 &&
        code <= 77
      ) {

        return {
          icon: "❄️",
          text: "أجواء ثلجية",
          theme: "snow"
        };

      }


      if (
        code >= 80 &&
        code <= 82
      ) {

        return {
          icon: "🌧️",
          text: "زخات مطر",
          theme: "rainy"
        };

      }


      if (code >= 95) {

        return {
          icon: "⛈️",
          text: "عاصفة رعدية",
          theme: "storm"
        };

      }


      return {
        icon: "🌤️",
        text: "حالة جوية غير معروفة",
        theme: "cloudy"
      };

    }


    /* ========================================
       تغيير لون الصفحة
    ======================================== */

    function changeTheme(theme) {

      document.body.classList.remove(
        "sunny",
        "cloudy",
        "rainy",
        "storm",
        "snow",
        "fog"
      );


      document.body.classList.add(theme);

    }


    /* ========================================
       شاشة التحميل
    ======================================== */

    function showLoading() {

      result.innerHTML = `

        <div class="loading">

          <div class="spinner"></div>

          جاري البحث عن الطقس...

        </div>

      `;

    }


    /* ========================================
       رسالة الخطأ
    ======================================== */

    function showError() {

      result.innerHTML = `

        <div class="error">

          ❌ حدث خطأ في الاتصال بالخادم

          <br><br>

          تأكد من اتصال الإنترنت
          وحاول مرة أخرى.

        </div>

      `;

    }


    /* ========================================
       حماية النصوص المعروضة
    ======================================== */

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ========================================
       زر البحث
    ======================================== */

    searchButton.addEventListener(
      "click",
      searchWeather
    );


    /* ========================================
       البحث بزر ENTER
    ======================================== */

    cityInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          searchWeather();

        }

      }
    );

  </script>

</body>
